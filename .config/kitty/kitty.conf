# vim:ft=conf
# kitty/kitty.conf
# @author nate zhou
# migrated from ~/.config/foot (foot.ini + bindings.ini) 2026
#
# 说明（foot -> kitty 对照）：
#   * font / scrollback / url 直接迁移
#   * 半页滚动存在差异：foot 的 half-page 在 kitty 无等价动作，用整页滚动近似
#   * url.style=curly（波浪线）kitty 无此选项，改用 underline_hyperlinks always 近似
#   * locked-title=yes：kitty 无等价项，程序仍可自行改标题
#   * scrollback-indicator / flash：kitty 用 visual_bell_* 近似
#   * foot 的 [search-bindings]（find-prev/extend-char/commit 等）为 foot 特有，
#     kitty 搜索框使用自身的固定键位，无法迁移；搜索入口已迁移为 Ctrl+/

# 默认加载暗色配色，亮色用 Ctrl+Shift+= 切换（见下方主题键位）
include ~/.config/kitty/colors-dark.conf

## ---------- 字体 (foot: font=Comic Mono:size=14) ----------
font_family Comic Mono
font_size 14

## ---------- 回滚 (foot: [scrollback] lines=16384) ----------
scrollback_lines 16384

## ---------- URL (foot: launch=firefox + style=curly) ----------
open_url_with firefox
underline_hyperlinks always
# foot 无 url 前景色，kitty 默认链接蓝在暗色下可读；如需调色加 url_color

## ---------- 视觉铃铛 (foot: flash=7f7f00 flash-alpha=0.5 近似) ----------
visual_bell_duration 100
visual_bell_color #7f7f00

## ---------- 背景不透明 (foot: alpha=1) ----------
background_opacity 1.0

## ---------- 遥控：供主题切换的 `kitten @ set-colors` 使用 ----------
allow_remote_control yes

## ============================================================
## 键位迁移 (foot: bindings.ini)
## ============================================================

## --- 字体缩放 (foot: font-increase/decrease/reset) ---
map ctrl+equal        change_font_size all +2.0
map ctrl+shift+i      change_font_size all +2.0
map ctrl+minus        change_font_size all -2.0
map ctrl+shift+o      change_font_size all -2.0
map ctrl+backspace    change_font_size all 0
map ctrl+shift+z      change_font_size all 0

## --- 回滚滚动 (foot: scrollback-*) ---
# foot 的 half-page 在 kitty 无等价动作，用整页滚动近似
map ctrl+shift+k      scroll_page_up
map ctrl+shift+j      scroll_page_down
map ctrl+shift+p      scroll_page_up
map ctrl+shift+n      scroll_page_down
map ctrl+shift+t      scroll_home
map ctrl+shift+b      scroll_end

## --- URL (foot: show-urls-launch / show-urls-copy) ---
map ctrl+shift+f      kitten hints --type url
map ctrl+shift+y      kitten hints --type url --action copy

## --- 新终端窗口 (foot: spawn-terminal) ---
map ctrl+shift+m      new_window

## --- 明暗主题切换 (foot: color-theme-switch-dark / -light) ---
map ctrl+shift+minus  kitten @ set-colors /home/hsin/.config/kitty/colors-dark.conf
map ctrl+shift+equal  kitten @ set-colors /home/hsin/.config/kitty/colors-light.conf

## --- 搜索 (foot: search-start=Ctrl+/) ---
map ctrl+slash        search_scrollback