# Reflector configuration file for the systemd service.
#
# Empty lines and lines beginning with "#" are ignored. All other lines should
# contain valid reflector command-line arguments, parsed with shlex.
# See "reflector --help" for details.
#
# Used by reflector.service (weekly reflector.timer) and by
# ~/.local/bin/refresh-mirror, so both paths stay identical.

# Destination of the generated list; pacman.d/mirrorlist is overwritten.
--save /etc/pacman.d/mirrorlist

# Only https mirrors that hold a complete copy of the repositories, then the
# 20 best scored by the Arch Linux MirrorStatus API.
--protocol https
--completion-percent 100
--score 20

# Measure the download rate of those 20 and keep the 5 fastest, which matches
# ParallelDownloads in pacman.conf.
--fastest 5

# Rating downloads extra.db (~9 MiB); the 5s default would drop every mirror
# slower than ~2 MiB/s instead of measuring it.
--download-timeout 30

# Log the measured rate of each mirror to the journal.
--verbose
